// ----- PNG -----
async function makePng(a) {
  const RR = RQ(a), N = RR.length, P = passN(N), W = 1080, H = 640 + Math.ceil(N / 5) * 150 + 110, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d"), F = '"BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", sans-serif';
  const pass = a.s >= P, name = S.name.trim() || "　";
  const texts = "はたさく・やさい もぎしけん ランダム なまえ ひづけ てんすう ごうかく めやす ライン クリア まで あと もん ○×0123456789/ " + name;
  try { await Promise.all([document.fonts.load("700 60px " + F, texts), document.fonts.load("700 40px " + F, texts), document.fonts.load("400 30px " + F, texts)]); } catch (e) {}
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#111"; g.textBaseline = "alphabetic";
  const M = 80;
  g.font = "700 46px " + F; g.fillText("はたさく・やさい　" + tname(a.t), M, 130);
  g.fillRect(M, 160, W - 2 * M, 4);
  g.font = "400 30px " + F; g.fillStyle = "#555"; g.fillText("なまえ", M, 240); g.fillText("ひづけ", M, 300);
  g.fillStyle = "#111"; g.font = "700 40px " + F;
  let nm = name; while (g.measureText(nm).width > W - 2 * M - 140 && nm.length > 1) nm = nm.slice(0, -1);
  g.fillText(nm, M + 130, 242); g.fillText(fmtDate(a.d), M + 130, 302);
  g.fillStyle = "#ccc"; g.fillRect(M + 130, 256, W - 2 * M - 130, 2);
  // score
  g.fillStyle = "#555"; g.font = "400 30px " + F; g.fillText("てんすう", M, 400);
  g.fillStyle = "#111"; g.font = "700 150px " + F; g.fillText(String(a.s), M, 560);
  const sw = g.measureText(String(a.s)).width;
  g.font = "700 56px " + F; g.fillText("/ " + N, M + sw + 20, 560);
  g.font = "400 30px " + F; g.fillStyle = "#555"; g.fillText("ごうかく めやす　" + P + " / " + N, 620, 470);
  g.font = "700 40px " + F; g.fillStyle = "#111";
  g.fillText(pass ? "ごうかく ライン クリア" : "あと " + (P - a.s) + "もん", 620, 535);
  // grid 5 x 4
  const gx = M, gy = 640, cw = (W - 2 * M) / 5, ch = 150;
  g.strokeStyle = "#111"; g.lineWidth = 2;
  RR.forEach((qi, k) => {
    const x = gx + (k % 5) * cw, y = gy + Math.floor(k / 5) * ch, ok = a.a[k] === Q[qi][1];
    g.strokeRect(x, y, cw, ch);
    g.fillStyle = "#555"; g.font = "400 28px " + F; g.fillText(String(k + 1), x + 16, y + 40);
    g.fillStyle = "#111"; g.font = "700 76px " + F; g.textAlign = "center";
    g.fillText(ok ? "○" : "×", x + cw / 2, y + 112); g.textAlign = "left";
  });
  g.fillStyle = "#555"; g.font = "400 26px " + F;
  g.fillText("○ ただしい　× まちがい", M, gy + Math.ceil(N / 5) * ch + 50);
  return cv;
}
async function drawPreview() {
  const img = document.getElementById("pv"); if (!img) return;
  const cv = await makePng(S.att[view.k]); img.src = cv.toDataURL("image/png");
}
async function savePng() {
  const a = S.att[view.k], msg = document.getElementById("dlmsg");
  if (!S.name.trim()) { msg.textContent = "さきに なまえを かいて ください。"; document.getElementById("nm").focus(); return; }
  const cv = await makePng(a);
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  const d = fmtDate(a.d).replace(/\//g, "");
  try { await dl.save({ filename: `${a.t === 0 ? "ランダム10もん" : "もぎしけん" + a.t}_${S.name.trim()}_${d}.png`, data: blob }); msg.textContent = "ほぞん しました。"; }
  catch (e) {
    const c = e && e.code;
    if (c === "declined") msg.textContent = "";
    else if (c === "rate_limited") msg.textContent = "すこし まって から もう いちど おして ください。";

}

function newWordQuiz() {
  const pick = shuffle(WORDS).slice(0, 10);

    const dir = Math.random() < .5 ? "w2d" : "d2w";
    let pool = shuffle(WORDS.filter(y => y !== x && y.ci === x.ci));
    if (pool.length < 2) pool = pool.concat(shuffle(WORDS.filter(y => y !== x && y.ci !== x.ci)));
    return { x, dir, opts: shuffle([x].concat(pool.slice(0, 2))) };
  });
  return { items, i: 0, pick: null, score: 0 };
}

// ---------- events ----------
document.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-act]"); if (!el) return;
  if (el.dataset.go) { go(el.dataset.go); return; }
  const act = el.dataset.act, v = view;
  switch (act) {
    case "home": go("home"); break;
    case "newrand": if (view.r !== "home" || !(S.cur && S.cur.t === 0)) { S.cur = null; save(); } go("random"); break;
    case "ans": {
      const c = S.cur; c.a[c.i] = +el.dataset.v; v.ask = false; save();
      const stay = c.i === c.a.length - 1; render();
      if (!stay) setTimeout(() => { if (view.r === "exam" && S.cur === c) { c.i++; save(); render(); } }, 280);
      break; }
    case "prev": S.cur.i--; save(); render(); break;
    case "next": S.cur.i++; save(); render(); break;
    case "jump": S.cur.i = +el.dataset.i; save(); render(); break;
    case "grade": if (!el.dataset.force && S.cur.a.some(x => x === null)) { v.ask = true; render(); } else gradeExam(); break;
    case "noask": v.ask = false; render(); break;
    case "filter": v.filter = el.dataset.v; render(); break;
    case "png": savePng(); break;
    case "rpick": {
      const qi = v.list[v.i]; v.pick = +el.dataset.v;
      if (v.pick === Q[qi][1]) { S.wrong = S.wrong.filter(x => x !== qi); v.cleared++; save(); }
      render(); break; }
    case "rnext": v.i++; v.pick = null; render(); window.scrollTo(0, 0); break;
    case "cat": v.cat = +el.dataset.v; v.i = 0; v.flip = false; v.list = null; render(); break;
    case "flip": v.flip = !v.flip; render(); break;
    case "cprev": v.i--; v.flip = false; render(); break;
    case "cnext": v.i++; v.flip = false; render(); break;
    case "cshuf": v.list = shuffle(WORDS.filter(x => v.cat < 0 || x.ci === v.cat)); v.i = 0; v.flip = false; render(); break;
    case "wpick": { v.pick = +el.dataset.v; const it = v.items[v.i]; if (it.opts[v.pick] === it.x) v.score++; render(); break; }
    case "wnext": v.i++; v.pick = null; render(); window.scrollTo(0, 0); break;
    case "jpick": { v.pick = +el.dataset.v; const it = v.items[v.i]; if (it.opts[v.pick] === it.right) v.score++; render(); break; }
    case "jnext": v.i++; v.pick = null; render(); window.scrollTo(0, 0); break;
    case "askwipe": v.ask = true; render(); break;
    case "wipe": S.att = []; S.wrong = []; S.cur = null; save(); view.ask = false; render(); break;
  }
});
